<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calisthenics Roadmap — с нуля до элементов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Calisthenics Roadmap</h1>
            <p class="subtitle">Путь от нуля до продвинутых элементов</p>
            <div class="progress-wrapper">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">
                    <span id="progressText">0 / 0</span>
                    <span id="progressPercent">0%</span>
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-secondary" id="expandAllBtn">Развернуть всё</button>
                <button class="btn btn-secondary" id="collapseAllBtn">Свернуть всё</button>
                <button class="btn btn-danger" id="resetBtn">Сбросить прогресс</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="roadmap" id="roadmap"></div>

        <footer class="footer">
            <p>Прогресс сохраняется автоматически в этом браузере. Клик по карточке упражнения — детали и GIF.</p>
        </footer>
    </main>

    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal" id="modal" role="dialog" aria-modal="true">
            <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
            <div class="modal-media" id="modalMedia"></div>
            <div class="modal-body">
                <div class="modal-category" id="modalCategory"></div>
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-target" id="modalTarget"></div>
                <div class="modal-tip" id="modalTip"></div>
                <div class="modal-requires" id="modalRequires"></div>
                <div class="modal-unlock" id="modalUnlock"></div>
                <div class="modal-actions">
                    <button class="btn btn-primary" id="modalToggle">Отметить выполненным</button>
                    <a class="btn btn-secondary" id="modalVideo" target="_blank" rel="noopener">Видео техники ↗</a>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
