services:
  roadmap:
    image: nginx:alpine
    container_name: calisthenics-roadmap
    restart: always
    ports:
      - "8765:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./data.js:/usr/share/nginx/html/data.js:ro
      - ./favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./img:/usr/share/nginx/html/img:ro
