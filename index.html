<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calisthenics Roadmap — с нуля до элементов</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="container header-inner">
            <div class="brand">
                <h1>Calisthenics Roadmap</h1>
                <p class="subtitle">От базы к сложным элементам</p>
            </div>
            <div class="progress-summary" aria-label="Общий прогресс">
                <div class="progress-copy">
                    <span class="progress-label">Общий прогресс</span>
                    <strong id="progressPercent">0%</strong>
                </div>
                <div class="progress-bar" aria-hidden="true">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="progressText">0 из 0 упражнений</span>
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="view-tabs" role="tablist" aria-label="Разделы">
            <button class="view-tab active" id="currentTab" type="button" role="tab" aria-selected="true" aria-controls="currentView" data-view="current">Сейчас</button>
            <button class="view-tab" id="roadmapTab" type="button" role="tab" aria-selected="false" aria-controls="roadmapView" data-view="roadmap">Вся карта</button>
        </nav>

        <section class="view-panel" id="currentView" role="tabpanel" aria-labelledby="currentTab">
            <div class="current-heading">
                <div>
                    <span class="section-kicker">Текущий этап</span>
                    <h2 id="currentStageTitle">Подготовка тела</h2>
                    <p id="currentStagePeriod"></p>
                </div>
                <span class="stage-total" id="currentStageProgress">0 / 0</span>
            </div>
            <div class="current-grid" id="currentExercises"></div>
        </section>

        <section class="view-panel" id="roadmapView" role="tabpanel" aria-labelledby="roadmapTab" hidden>
            <div class="roadmap-toolbar">
                <div>
                    <span class="section-kicker">Все этапы</span>
                    <h2>Карта развития</h2>
                </div>
                <div class="controls">
                    <button class="btn btn-secondary" id="expandAllBtn">Развернуть всё</button>
                    <button class="btn btn-secondary" id="collapseAllBtn">Свернуть всё</button>
                    <button class="btn btn-danger" id="resetBtn">Сбросить</button>
                </div>
            </div>
            <div class="roadmap" id="roadmap"></div>
        </section>

        <footer class="footer">
            <p>Прогресс сохраняется в этом браузере.</p>
        </footer>
    </main>

    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal" id="modal" role="dialog" aria-modal="true">
            <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
            <div class="modal-media" id="modalMedia"></div>
            <div class="modal-body">
                <div class="modal-category" id="modalCategory"></div>
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-target" id="modalTarget"></div>
                <div class="modal-tip" id="modalTip"></div>
                <div class="modal-requires" id="modalRequires"></div>
                <div class="modal-unlock" id="modalUnlock"></div>
                <div class="modal-actions">
                    <button class="btn btn-primary" id="modalToggle">Отметить выполненным</button>
                    <a class="btn btn-secondary" id="modalVideo" target="_blank" rel="noopener">Видео техники ↗</a>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
